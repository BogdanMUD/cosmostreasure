<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Farm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu">
        <h1 class="pulsating-title">Space Farm</h1>
        <div class="menu-buttons">
            <button id="btn-start-game">Start New Game</button>
            <button id="btn-load-main">Load Game</button>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="top-bar">
                <div id="resources">
                    <span title="Leader Inventory">🎒 <span id="res-inv">0</span>/10</span>
                    <span title="Storage Wood">🪵 <span id="res-wood">0</span></span>
                </div>
                <div id="controls">
                    <button id="btn-save">Save</button>
                    <button id="btn-load">Load</button>
                    <span id="save-status"></span>
                </div>
            </div>

            <div id="context-menu" class="hidden">
                <!-- Action buttons will be injected here -->
            </div>

            <div id="build-menu">
                <button class="build-btn" data-type="storage" data-cost="10" data-width="1" data-height="1">
                    📦 Storage (10 Wood)
                </button>
                <button class="build-btn" data-type="house" data-cost="15" data-width="2" data-height="2">
                    🏠 House (15 Wood)
                </button>
                <button class="build-btn" data-type="factory" data-cost="30" data-width="2" data-height="2">
                    🏭 Factory (30 Wood)
                </button>
                <button class="build-btn" data-type="spaceport" data-cost="50" data-width="3" data-height="3">
                    🚀 Spaceport (50 Wood)
                </button>
                <button id="btn-cancel-build" class="hidden">❌ Cancel</button>
            </div>

            <div id="win-screen" class="hidden">
                <h1>🚀 Rocket Launched! 🚀</h1>
                <p>Congratulations! You have successfully built the rocket and completed the first phase!</p>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
    <script src="map.js"></script>
    <script src="pathfinding.js"></script>
    <script src="entities.js"></script>
    <script src="main.js"></script>
</body>
</html>
