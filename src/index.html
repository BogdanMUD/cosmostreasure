<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Farm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu">
        <h1 class="pulsating-title">Space Farm</h1>
        <div class="menu-buttons">
            <button id="btn-start-game">Start New Game</button>
            <button id="btn-load-main">Load Game</button>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="gameCanvas"></canvas>
        <canvas id="overlay-ambient"></canvas>

        <div id="ui-layer">
            <div id="top-bar">
                <div id="resources">
                    <span title="Leader Inventory (Wood/Raw)">🎒 <span id="res-inv-wood">0</span>🪵 <span id="res-inv-raw">0</span>⚙️ (Total: <span id="res-inv-total">0</span>/10)</span>
                    <span title="Storage">📦 <span id="res-wood">0</span>/30 🪵 | <span id="res-raw">0</span> ⚙️</span>
                </div>
                <div id="stage-info">
                    <span id="current-stage">Stage 1: Wood</span>
                </div>
                <div id="time-weather" style="margin-left: 20px; font-weight: bold;">
                    🕰️ <span id="clock-display">08:00</span>
                </div>
                <div id="controls">
                    <button id="btn-save">Save</button>
                    <button id="btn-load">Load</button>
                    <button id="btn-main-menu" style="background: #e74c3c;">Main Menu</button>
                    <span id="save-status"></span>
                </div>
            </div>

            <div id="stage-popup" class="hidden popup-anim">
                <h2 id="stage-popup-text">Stage Unlocked!</h2>
            </div>

            <!-- Minimap -->
            <div id="minimap-container">
                <canvas id="minimapCanvas" width="150" height="150"></canvas>
            </div>

            <div id="build-toggle-container">
                <button id="btn-toggle-build">🔨 Build Menu</button>
            </div>

            <div id="context-menu" class="hidden">
                <!-- Action buttons will be injected here -->
            </div>

            <div id="build-menu" class="hidden">
                <button class="build-btn" data-type="storage" data-cost="10" data-width="2" data-height="2">
                    📦 Storage (10 🪵)<br><small>2x2 Footprint</small>
                </button>
                <button class="build-btn" data-type="house" data-cost="15" data-width="2" data-height="2">
                    🏠 House (15 🪵)<br><small>2x2 Footprint</small>
                </button>
                <button class="build-btn" data-type="factory" data-cost="30" data-width="3" data-height="3">
                    🏭 Factory (30 🪵)<br><small>3x3 Footprint</small>
                </button>
                <button class="build-btn" data-type="spaceport" data-cost="50" data-cost-raw="10" data-width="5" data-height="5">
                    🚀 Spaceport (50 🪵, 10 ⚙️)<br><small>5x5 Footprint</small>
                </button>
                <button id="btn-cancel-build" class="hidden">❌ Cancel</button>
            </div>

            <div id="win-screen" class="hidden">
                <h1>🚀 Rocket Launched! 🚀</h1>
                <p>Congratulations! You have successfully built the rocket and completed the first phase!</p>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
    <script src="map.js"></script>
    <script src="pathfinding.js"></script>
    <script src="entities.js"></script>
    <script src="main.js"></script>
</body>
</html>
